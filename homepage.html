<!DOCTYPE html>
<html>
<head>
    <title>My Awesome Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        nav {
            background: #222;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        nav h2 {
            margin: 0;
            color: #ffcc70;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 45px;
        }

        .hero p {
            font-size: 20px;
        }

        button {
            background: #ffcc70;
            color: #222;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            color: #333;
            padding: 30px;
            width: 220px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px #33333355;
        }

        footer {
            background: #222;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyWebsite</h2>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to My Website!</h1>
        <p>Explore, Learn and Grow With Us.</p>
        <button>Get Started</button>
    </section>

    <section class="cards">
        <div class="card">
            <h2>🚀 Innovation</h2>
            <p>Discover new ideas and technology.</p>
        </div>

        <div class="card">
            <h2>💡 Learning</h2>
            <p>Learn new skills and improve yourself.</p>
        </div>

        <div class="card">
            <h2>🌟 Success</h2>
            <p>Build your future with confidence.</p>
        </div>
    </section>

    <footer>
        <p>© 2026 MyWebsite | All Rights Reserved</p>
    </footer>

</body>
</html>
